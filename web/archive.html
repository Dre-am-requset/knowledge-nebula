<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识星云资料库</title>
<style>
:root{--ink:#16293b;--muted:#66798c;--blue:#2168a8;--teal:#246e65;--line:#dce6ee;--paper:#f7fafc;--tint:#eaf2f8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "Microsoft YaHei UI","PingFang SC",sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue)}button{cursor:pointer}header{background:white;padding:24px 34px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:38px}h1{font:600 26px/1.3 "Microsoft YaHei",sans-serif;margin:0;white-space:nowrap}header p{margin:5px 0 0;color:var(--muted);font-size:12px}.searchbox{display:flex;flex:1;max-width:780px}#query{width:100%;min-width:0;background:var(--paper);border:1px solid #b7cbdc;border-right:0;border-radius:6px 0 0 6px;padding:12px 15px}#submit{border:0;border-radius:0 6px 6px 0;padding:0 23px;background:var(--blue);color:white;white-space:nowrap}.workspace{display:grid;grid-template-columns:246px 1fr;min-height:calc(100vh - 110px)}aside{padding:25px 18px 30px 26px;border-right:1px solid var(--line);background:#f0f5f9}.sectionlabel{color:var(--muted);font-size:12px;margin:20px 0 9px}.sectionlabel:first-child{margin-top:0}.navbtn{display:block;width:100%;text-align:left;border:0;border-radius:5px;background:none;padding:9px 10px;color:var(--ink);margin:3px 0}.navbtn.active{background:#dceaf5;color:#164e7e;font-weight:600}.navbtn small{display:block;color:var(--muted);font-size:11px;font-weight:400}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{border:1px solid #c5dcd6;color:var(--teal);background:#f7fcfa;border-radius:4px;padding:3px 7px;font-size:12px}.tag.active{background:var(--teal);color:white}.dates{display:grid;gap:8px}input[type=date]{width:100%;border:1px solid #b9cbd9;border-radius:4px;padding:6px;background:white;color:var(--ink)}.note{font-size:12px;color:var(--muted);margin-top:26px;line-height:1.8}.main{min-width:0}.toolbar{display:flex;gap:8px;align-items:center;padding:15px 26px;border-bottom:1px solid var(--line);background:white;flex-wrap:wrap}.kind{border:0;background:none;color:var(--muted);padding:5px 9px;border-bottom:2px solid transparent}.kind.active{color:var(--blue);border-color:var(--blue);font-weight:600}#total{margin-left:auto;color:var(--muted);font-size:12px}.panes{display:grid;grid-template-columns:minmax(300px,39%) minmax(400px,61%)}.results{border-right:1px solid var(--line);min-height:calc(100vh - 173px)}.result{width:100%;text-align:left;padding:20px 24px;border:0;border-bottom:1px solid var(--line);background:white;display:block}.result:hover{background:#f4f8fb}.result.active{background:#eaf3fa;box-shadow:inset 3px 0 var(--blue)}.result h3{font-size:15px;line-height:1.6;margin:7px 0 10px;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted)}.badge{font-size:11px;color:var(--teal);margin-right:9px}.excerpt{font-size:12px;line-height:1.8;color:#526678;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}.result .meta:last-child{margin-top:11px}.reader{padding:30px 36px;background:white;min-height:calc(100vh - 173px);min-width:0}.reader h2{font:600 24px/1.6 "Microsoft YaHei",sans-serif;margin:0 0 12px;overflow-wrap:anywhere}.reader .intro{margin-bottom:22px}.body{font:16px/1.95 "NSimSun","Songti SC","SimSun",serif;white-space:pre-wrap;overflow-wrap:anywhere;max-width:74ch;color:#263b4f}.empty{padding:70px 22px;text-align:center;color:var(--muted)}.empty h2{font-size:19px;font-weight:500;color:var(--ink)}.source-toggle{border:1px solid #b8cbda;background:var(--paper);border-radius:5px;padding:8px 12px;margin-top:24px;color:var(--blue)}.source{border-top:1px solid var(--line);padding:14px 0;margin-top:14px;overflow-wrap:anywhere}.source pre{font:13px/1.7 "Microsoft YaHei UI",sans-serif;white-space:pre-wrap;margin:7px 0}.source a,.reader a{color:var(--blue);font-size:12px}.pagination{display:flex;gap:12px;justify-content:center;padding:20px}.pagination button{border:1px solid var(--line);background:white;border-radius:4px;padding:5px 13px;color:var(--blue)}button:disabled{cursor:default;opacity:.4}.reset{border:0;background:none;color:var(--blue);font-size:12px;padding:0;margin-top:12px}.pending{padding:9px 10px;color:var(--muted);font-size:12px;border-left:2px solid #a9bdcc;margin-top:8px}.error{color:#a54a42}.mobileback{display:none}#linksPanel{border-top:1px solid var(--line);margin-top:14px}mark{background:#fff0a6;color:inherit;border-radius:2px;padding:0 1px}
@media(max-width:1150px){.workspace{grid-template-columns:210px 1fr}.panes{grid-template-columns:1fr}.results{border-right:0}.reader{display:none}.main.reading .reader{display:block}.main.reading .results{display:none}.mobileback{display:inline-block;margin-bottom:18px;border:0;background:none;color:var(--blue);padding:0}.reader{padding:25px}}@media(max-width:700px){header{padding:20px;display:block}h1{font-size:23px}.searchbox{margin-top:18px}.workspace{display:block}aside{padding:13px 20px;border-right:0;border-bottom:1px solid var(--line)}aside .sectionlabel:not(:first-child),aside .tags,aside .dates,aside .note,aside .pending{display:none}#groups{display:flex;overflow:auto;gap:5px}.navbtn{min-width:120px}.navbtn small{font-size:10px}.toolbar{padding:10px 12px;gap:0}.kind{font-size:12px}#total{width:100%;padding:7px 9px}.reader{padding:22px}.result{padding:18px 22px}.reader h2{font-size:21px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<header><div><h1><a href="/" style="color:inherit;text-decoration:none">Knowledge Nebula · 知识星云</a></h1><p>从分享中找方法，也保留讨论的来龙去脉。</p></div><form class="searchbox" id="searchForm"><input id="query" aria-label="搜索经验、问题或关键词" placeholder="搜索经验、问题或关键词，例如：标注、结算、提示词"><button id="submit">搜索</button></form></header>
<div class="workspace"><aside><div class="sectionlabel">资料来源</div><nav id="groups" aria-label="资料来源"></nav><div class="sectionlabel">主题筛选</div><div class="tags" id="tags"></div><div class="sectionlabel">消息时间</div><div class="dates"><input id="start" type="date" aria-label="开始日期"><input id="end" type="date" aria-label="结束日期"></div><button class="reset" id="reset">清除筛选</button><div class="note" id="coverage">正在读取覆盖范围…</div><button class="reset" id="showLinks">查看文档收录情况</button><div id="linksPanel" hidden></div></aside>
<main class="main" id="main"><div class="toolbar" id="kinds"></div><div class="panes"><section class="results" aria-label="检索结果"><div id="results" aria-live="polite"></div><div class="pagination"><button id="prev">上一页</button><span id="pageLabel"></span><button id="next">下一页</button></div></section><article class="reader" id="reader"><div class="empty"><h2>选择一段讨论，读完整上下文</h2><p>按话题组织回复，按时间整理普通聊天。<br>每条记录都能追溯到群聊原消息。</p></div></article></div></main></div>
<script>
const state={q:'',chat:'',kind:'',tag:'',page:1,total:0,selected:null},names={},labels={topic:'话题讨论',fragment:'聊天片段',document:'文档与附件',experience:'经验条目'};
const $=id=>document.getElementById(id);let requestNumber=0;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function link(url,text){const a=el('a',null,text);try{const u=new URL(url);if(['http:','https:'].includes(u.protocol)){a.href=url;a.target='_blank';a.rel='noopener noreferrer'}}catch{}return a}
async function api(path){const r=await fetch(path);const d=await r.json();if(!r.ok)throw Error(d.error||'读取失败');return d}
function highlight(node,text){if(!state.q){node.textContent=text;return}let pos=0,at;while((at=text.indexOf(state.q,pos))>=0){node.append(document.createTextNode(text.slice(pos,at)),el('mark',null,state.q));pos=at+state.q.length}node.append(document.createTextNode(text.slice(pos)))}
function nav(){document.querySelectorAll('[data-chat]').forEach(b=>b.classList.toggle('active',b.dataset.chat===state.chat));document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind===state.kind));document.querySelectorAll('[data-tag]').forEach(b=>b.classList.toggle('active',b.dataset.tag===state.tag))}
async function search(reset=true){if(reset)state.page=1;nav();$('main').classList.remove('reading');const turn=++requestNumber;const p=new URLSearchParams({...state,raw:'1',start:$('start').value,end:$('end').value});$('total').textContent='正在检索…';try{const d=await api('/api/search?'+p);if(turn!==requestNumber)return;state.total=d.total;$('total').textContent=`找到 ${d.total.toLocaleString()} 条记录`;$('results').replaceChildren();for(const row of d.results){const b=el('button','result');b.dataset.id=row.id;b.append(el('span','badge',labels[row.kind]),el('span','meta',names[row.chat]||row.chat));const h=el('h3');highlight(h,row.title);b.append(h);const e=el('p','excerpt');highlight(e,row.excerpt);b.append(e,el('div','meta',`${row.last||''}　${row.sources} 条原消息`));b.onclick=()=>openDoc(row.id);$('results').append(b)}if(!d.results.length){const box=el('div','empty');box.append(el('h2',null,'没有找到匹配记录'),el('p',null,'试试更短的关键词，或清除群聊、日期筛选。'));$('results').append(box)}$('prev').disabled=state.page===1;$('next').disabled=state.page*20>=state.total;$('pageLabel').textContent=`${state.page} / ${Math.max(1,Math.ceil(state.total/20))}`}catch(e){$('total').textContent=e.message;$('total').classList.add('error')}}
async function openDoc(id){state.selected=id;document.querySelectorAll('.result').forEach(b=>b.classList.toggle('active',b.dataset.id===id));try{const d=await api('/api/doc/'+encodeURIComponent(id));if(state.selected!==id)return;const r=$('reader');r.replaceChildren();const back=el('button','mobileback','返回结果');back.onclick=()=>$('main').classList.remove('reading');r.append(back,el('h2',null,d.title));const intro=el('div','intro');intro.append(el('div','meta',`${d.name}　${labels[d.kind]}　${d.first||''} ～ ${d.last||''}`));const ts=el('div','tags');for(const t of d.tags){const b=el('button','tag',t);b.onclick=()=>{state.tag=t;search()};ts.append(b)}intro.append(ts);if(d.url)intro.append(link(d.url,'打开原始出处'));r.append(intro);const body=el('div','body');highlight(body,d.body);r.append(body);const toggle=el('button','source-toggle',`查看原消息（${d.source_total} 条）`),sources=el('div');sources.hidden=true;toggle.onclick=()=>{sources.hidden=!sources.hidden;toggle.textContent=sources.hidden?`查看原消息（${d.source_total} 条）`:'收起原消息'};r.append(toggle,sources);let offset=0;const appendSources=data=>{for(const m of data.sources){const box=el('div','source');box.append(el('div','meta',`${m.time||''}　${m.sender}　${m.type}`),el('pre',null,m.content));if(m.url)box.append(link(m.url,'打开这条消息'));sources.append(box)}};appendSources(d);if(d.has_more){const more=el('button','source-toggle','加载更多原消息');more.onclick=async()=>{offset+=30;more.disabled=true;try{const next=await api('/api/doc/'+encodeURIComponent(id)+'?offset='+offset);appendSources(next);more.hidden=!next.has_more}finally{more.disabled=false}};sources.append(more)}$('main').classList.add('reading');if(innerWidth<1151)$('main').scrollIntoView({block:'start'})}catch(e){$('reader').replaceChildren(el('p','error',e.message))}}
async function init(){try{const s=await api('/api/stats');const all=el('button','navbtn active','全部来源');all.dataset.chat='';all.onclick=()=>{state.chat='';search()};$('groups').append(all);for(const g of s.groups){names[g.id]=g.name;const b=el('button','navbtn',g.name);b.dataset.chat=g.id;b.append(el('small',null,`${g.messages.toLocaleString()} 条　截至 ${g.latest?.slice(0,10)||'未知'}${g.sync_status==='permission_denied'?'　仅历史记录':''}`));b.onclick=()=>{state.chat=g.id;search()};$('groups').append(b)}for(const tag of ['量化研究','标注与交付','接单与兼职','结算与报酬','工具与方法','经验与避坑']){const b=el('button','tag',tag);b.dataset.tag=tag;b.onclick=()=>{state.tag=state.tag===tag?'':tag;search()};$('tags').append(b)}for(const [key,name]of [['','全部记录'],...Object.entries(labels)]){const b=el('button','kind',name);b.dataset.kind=key;b.onclick=()=>{state.kind=key;search()};$('kinds').append(b)}$('kinds').append(el('span',null,''));$('kinds').lastChild.id='total';const count=s.groups.reduce((a,g)=>a+g.messages,0),latest=s.groups.map(g=>g.latest||'').sort().at(-1),recalled=s.groups.reduce((a,g)=>a+g.recalled,0);$('coverage').textContent=`已保存 ${count.toLocaleString()} 条消息，覆盖至 ${latest}。已撤回的 ${recalled.toLocaleString()} 条内容不进入检索。话题保留回复上下文；聊天片段按时间邻近整理。`;await search()}catch(e){$('coverage').textContent=e.message;$('coverage').classList.add('error')}}
$('searchForm').onsubmit=e=>{e.preventDefault();state.q=$('query').value.trim();search()};$('start').onchange=$('end').onchange=()=>search();$('prev').onclick=()=>{state.page--;search(false)};$('next').onclick=()=>{state.page++;search(false)};$('reset').onclick=()=>{Object.assign(state,{q:'',chat:'',kind:'',tag:''});$('query').value=$('start').value=$('end').value='';search()};$('showLinks').onclick=async()=>{const p=$('linksPanel');p.hidden=!p.hidden;if(!p.hidden){try{const links=await api('/api/links');p.replaceChildren();for(const l of links){const n=el('div','source');n.append(link(l.url,l.title||l.kind+' 文档'),el('div','meta',({fetched:'正文已收录',browser_partial:'浏览器可见内容已收录',embedded_pending:'正文已收录，嵌入内容待补',pending:'待读取正文',permission_denied:'无读取权限',unsupported:'需单独读取表格／应用',not_available:'链接不可用',source_withdrawn:'来源消息已撤回',failed:'读取失败'})[l.status]||l.status));p.append(n)}if(!links.length)p.append(el('p','meta','当前记录中尚未发现飞书文档链接。'))}catch(e){p.textContent=e.message}}};init();
</script></html>
